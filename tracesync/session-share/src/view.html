<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared session</title>
<style>
	:root { --bg: #fbfaf7; --fg: #1d1c1a; --muted: #77736b; --line: #e6e2da; --card: #fff; --claude: #c96442; --codex: #2f6fd6; --pi: #3d8b5a; }
	@media (prefers-color-scheme: dark) { :root { --bg: #171614; --fg: #ece9e3; --muted: #9a958c; --line: #2c2a26; --card: #1f1e1b; } }
	* { box-sizing: border-box; }
	body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
	header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; }
	header h1 { font-size: 15px; margin: 0; }
	#turn { color: var(--muted); font-size: 13px; }
	main { max-width: 820px; margin: 0 auto; padding: 16px; }
	.row { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 6px 0; }
	.who { font-size: 12px; font-weight: 600; text-align: right; padding-top: 2px; }
	.who small { display: block; font-weight: 400; color: var(--muted); }
	.claude-code .who { color: var(--claude); } .codex .who { color: var(--codex); } .pi .who { color: var(--pi); }
	.body { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
	.user .body { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
	.tool .body, .result .body { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); max-height: 9em; overflow: hidden; }
	.thinking .body { color: var(--muted); font-style: italic; }
	.mark { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0; }
	.mark.checkpoint { color: var(--fg); font-weight: 600; }
	@media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 2px; } .who { text-align: left; } }
</style>
</head>
<body>
<header><h1>Shared session</h1><span id="turn"></span></header>
<main id="log"></main>
<script>
	const token = new URLSearchParams(location.search).get("token");
	const names = { "claude-code": "Claude Code", codex: "Codex", pi: "pi" };
	const log = document.getElementById("log");
	let after = 0;
	let shownBranch;

	function row(item, cls, text) {
		const div = document.createElement("div");
		div.className = `row ${item.agent ?? ""} ${cls}`;
		const who = document.createElement("div");
		who.className = "who";
		who.textContent = names[item.agent] ?? "";
		if (item.member && cls === "user") { const s = document.createElement("small"); s.textContent = item.member; who.append(s); }
		const body = document.createElement("div");
		body.className = "body";
		body.textContent = text;
		div.append(who, body);
		log.append(div);
	}

	function mark(cls, text) {
		const div = document.createElement("div");
		div.className = `mark ${cls}`;
		div.textContent = text;
		log.append(div);
	}

	function show(item) {
		if (item.kind === "checkpoint") return mark("checkpoint", `◆ ${item.checkpoint.label} — tagged by ${item.checkpoint.by}${item.checkpoint.git ? ` · ${item.checkpoint.git.slice(0, 10)}` : ""}`);
		if (item.kind === "fork") return mark("checkpoint", `↺ ${item.fork.by} went back to ${item.fork.label}; what came after is tagged “${item.fork.saved}”`);
		if (item.kind === "turn") return item.turn.phase === "start" ? mark("turn", `${names[item.agent]}${item.member ? ` · ${item.member}` : ""} took the turn`) : undefined;
		const m = item.message;
		if (m.role === "toolResult") return row(item, "result", `${m.isError ? "✗" : "↳"} ${m.content.slice(0, 1200)}`);
		for (const b of m.content) {
			if (b.type === "text") row(item, m.role === "user" ? "user" : "text", b.text);
			else if (b.type === "thinking") row(item, "thinking", b.thinking);
			else if (b.type === "toolCall") row(item, "tool", `${b.name} ${JSON.stringify(b.arguments).slice(0, 600)}`);
			else if (b.type === "image") row(item, "text", "(image)");
		}
	}

	async function poll() {
		try {
			const res = await fetch(`/items?after=${after}&token=${encodeURIComponent(token)}`);
			let { items, lease, branch } = await res.json();
			// After a fork the session is another branch: clear and read it from its first entry on the next poll.
			if (shownBranch !== undefined && branch !== shownBranch) { log.replaceChildren(); after = 0; items = []; }
			shownBranch = branch;
			const atEnd = innerHeight + scrollY >= document.body.scrollHeight - 40;
			for (const item of items) { show(item); after = Math.max(after, item.id); }
			document.getElementById("turn").textContent = lease ? `${names[lease.agent]} is working${lease.member ? ` (${lease.member})` : ""}` : "idle";
			if (items.length && atEnd) scrollTo(0, document.body.scrollHeight);
		} catch {}
		setTimeout(poll, 1000);
	}
	poll();
</script>
</body>
</html>
