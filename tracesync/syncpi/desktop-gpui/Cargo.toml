[package]
name = "syncpi-gpui"
version = "0.1.0"
edition = "2024"
description = "SyncPi as a native GPUI app: native window, sidebar and menus; each thread is the web view, embedded"

[dependencies]
anyhow = "1"
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["webview", "tree-sitter-languages"] }
gpui-component-assets = "=0.5.1"
markdown = "=1.0.0"
merman = { version = "=0.6.0", features = ["render"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
