[package]
name = "syncpi-desktop"
version = "0.1.0"
edition = "2024"

# The desktop app: a native window (Tauri) around the web app, which the app's local host serves (src/desktop/host.ts).

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
strip = true
lto = "thin"
